<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maryam car Loan Calculator - Premium Edition</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>car Loan Calculator</h1>
            <p>Calculate your car loan with precision and elegance</p>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="calculator">
                <h2>Loan Parameters</h2>
                <form id="loan-form">
                    <div class="form-group">
                        <label for="car-price">Car Price ($)</label>
                        <input type="number" id="car-price" min="0" step="100" value="30000">
                    </div>
                    <div class="form-group">
                        <label for="down-payment">Down Payment ($)</label>
                        <input type="number" id="down-payment" min="0" step="100" value="5000">
                    </div>
                    <div class="form-group">
                        <label for="loan-term">Loan Term (months)</label>
                        <input type="number" id="loan-term" min="12" max="120" value="60">
                    </div>
                    <div class="form-group">
                        <label for="interest-rate">Interest Rate (%)</label>
                        <input type="number" id="interest-rate" min="0" step="0.1" value="5.5">
                    </div>
                    <button type="submit" class="calculate-btn">Calculate Loan</button>
                </form>
            </section>

            <section class="results" id="results" style="display: none;">
                <h2>Loan Summary</h2>
                <div class="summary-cards">
                    <div class="card">
                        <h3>Monthly Payment</h3>
                        <p id="monthly-payment">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Total Interest</h3>
                        <p id="total-interest">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Total Payment</h3>
                        <p id="total-payment">$0.00</p>
                    </div>
                </div>
            </section>

            <section class="diagrams" id="diagrams" style="display: none;">
                <h2>Visual Breakdown</h2>
                <div class="chart-container">
                    <canvas id="payment-chart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="amortization-chart"></canvas>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Car Loan Calculator. Designed with luxury in mind.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
